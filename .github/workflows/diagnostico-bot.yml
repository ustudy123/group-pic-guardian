name: Diagnóstico do bot

# Diagnóstico manual do Macro I.A, sem enviar nada a ninguém.
#   - modo "conversa": o que aconteceu com as mensagens de um contato nas
#     últimas horas (recebida? foi para o histórico? resposta na fila? enviada?).
#     O log deste repositório é público: a saída não traz texto de mensagem nem
#     telefone completo.
#   - modo "envios-do-dia": quem estava ativo, quem recebeu a mensagem
#     programada de manhã/noite, a que horas e o status no WhatsApp.
#   - modo "fila": chama uma vez a fila de respostas (o mesmo que o job do banco
#     faz a cada minuto) e mostra o que o servidor devolveu.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "O que consultar"
        required: true
        type: choice
        default: conversa
        options: ["conversa", "envios-do-dia", "fila"]
      telefone:
        description: "Telefone do contato (modo conversa) — bastam os 8 últimos dígitos"
        required: false
        type: string
      data:
        description: "Dia do relatório envios-do-dia (AAAA-MM-DD; vazio = hoje)"
        required: false
        type: string
      horas:
        description: "Quantas horas para trás (modo conversa)"
        required: false
        type: string
        default: "6"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar
        env:
          BASE: https://project--07528081-b16b-457c-89ce-f6cbc3387af7.lovable.app/api/public/hooks
          SECRET: ${{ secrets.AI_BOT_WEBHOOK_SECRET }}
          MODO: ${{ github.event.inputs.modo }}
          TELEFONE: ${{ github.event.inputs.telefone }}
          HORAS: ${{ github.event.inputs.horas }}
          DATA: ${{ github.event.inputs.data }}
        run: |
          if [ "$MODO" = "fila" ]; then
            URL="$BASE/enviar-respostas-pendentes"; BODY='{}'
          elif [ "$MODO" = "envios-do-dia" ]; then
            D=$(printf '%s' "$DATA" | tr -cd '0-9-')
            URL="$BASE/diagnostico-conversa"; BODY="{\"relatorio\":\"envios\",\"data\":\"$D\"}"
          else
            TEL=$(printf '%s' "$TELEFONE" | tr -cd '0-9')
            H=$(printf '%s' "${HORAS:-6}" | tr -cd '0-9')
            URL="$BASE/diagnostico-conversa"; BODY="{\"telefone\":\"$TEL\",\"horas\":${H:-6}}"
          fi
          RESP=$(curl -sS -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Bot-Secret: $SECRET" \
            -w "\n__HTTP__%{http_code}" \
            -d "$BODY")
          echo "HTTP: $(printf '%s' "$RESP" | sed -n 's/.*__HTTP__//p')"
          echo "Resp: $(printf '%s' "$RESP" | sed 's/__HTTP__[0-9]*$//')"
