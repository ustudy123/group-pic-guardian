name: Mensagens Programadas do Bot

# AGENDAMENTO PRINCIPAL: pg_cron do banco (job 'mensagens-programadas',
# 07:00–08:55 BRT). Veja a migration 20260801120000_bot_ajustes_arthur.sql.
#
# O cron abaixo é REDE DE SEGURANÇA: se o job do banco não estiver instalado
# (foi o que aconteceu — o agendamento saiu do GitHub e o job nunca chegou a ser
# criado, então ninguém recebia o "bom dia"), este aqui garante o envio.
#
# O GitHub sofre throttling e dispara em horário imprevisível — por isso o
# endpoint agora recusa envio depois da janela + 2h (TOLERANCIA_ATRASO_MIN).
# Assim um disparo atrasado não manda "bom dia" às 22h como já aconteceu.
# A idempotência (telefone+período+data) impede mensagem repetida quando os dois
# agendadores rodam no mesmo dia.

on:
  schedule:
    - cron: "*/10 10-13 * * *"   # 07:00–10:59 BRT (a guarda corta após 10:15)
  workflow_dispatch:
    inputs:
      periodo:
        description: "Forçar período (teste fora da janela)"
        required: false
        type: choice
        options: ["", "manha", "noite"]
      numero_teste:
        description: "Diagnóstico: enviar 1 msg de teste para este número (ex: 5544999596898)"
        required: false
        type: string
      diagnostico:
        description: "Só explicar quem receberia hoje e por quê (não envia nada)"
        required: false
        type: boolean
        default: false

concurrency:
  group: mensagens-programadas
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar lote de mensagens
        env:
          ENDPOINT: https://project--07528081-b16b-457c-89ce-f6cbc3387af7.lovable.app/api/public/hooks/mensagens-programadas
          SECRET: ${{ secrets.AI_BOT_WEBHOOK_SECRET }}
          PERIODO: ${{ github.event.inputs.periodo }}
          NUMERO_TESTE: ${{ github.event.inputs.numero_teste }}
          DIAGNOSTICO: ${{ github.event.inputs.diagnostico }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "AI_BOT_WEBHOOK_SECRET não configurado nos secrets do repo."
            exit 1
          fi

          # batch moderado: o hook escalona os envios dentro da janela (cada
          # encarregado tem um minuto-alvo próprio), então cada execução manda só
          # quem já "venceu" o horário. Mantemos um teto baixo por execução para os
          # disparos saírem espaçados (anti-spam); a idempotência evita repetir.
          if [ "$DIAGNOSTICO" = "true" ]; then
            BODY='{"diagnostico":true}'
          elif [ -n "$NUMERO_TESTE" ]; then
            BODY="{\"testNumero\":\"$NUMERO_TESTE\"}"
          elif [ -n "$PERIODO" ]; then
            BODY="{\"batch\":10,\"periodo\":\"$PERIODO\"}"
          else
            BODY='{"batch":3}'
          fi

          RESP=$(curl -sS -X POST "$ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "X-Bot-Secret: $SECRET" \
            -w "\n__HTTP__%{http_code}" \
            -d "$BODY")
          CODIGO=$(printf '%s' "$RESP" | sed -n 's/.*__HTTP__//p')
          CORPO=$(printf '%s' "$RESP" | sed 's/__HTTP__[0-9]*$//')
          echo "HTTP: $CODIGO"
          echo "Resp: $CORPO"

          # Resposta vazia = endpoint não respondeu (URL errada, deploy fora do ar).
          # Sem esta checagem o job fica verde e o problema passa despercebido.
          if [ -z "$(printf '%s' "$CORPO" | tr -d '[:space:]')" ]; then
            echo "ERRO: o endpoint não devolveu nada. Confira a URL e se o deploy está no ar."
            exit 1
          fi
          if [ "$CODIGO" != "200" ]; then
            echo "ERRO: endpoint respondeu HTTP $CODIGO."
            exit 1
          fi
